<!-- Visit counter (see tools/counter-worker/README.md).
     Counts each page once per browser session. Sends only the page's path.
     Does nothing while COUNTER_URL is empty. -->
<script>
(function () {
  var COUNTER_URL = "";   // e.g. "https://book-counter.<your-subdomain>.workers.dev"
  if (!COUNTER_URL || location.protocol === "file:") return;

  var page = location.pathname;
  var key = "counted:" + page;
  var seen = false;
  try { seen = sessionStorage.getItem(key) === "1"; } catch (e) {}

  if (!seen) {
    fetch(COUNTER_URL + "/hit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ page: page })
    }).then(function () {
      try { sessionStorage.setItem(key, "1"); } catch (e) {}
    }).catch(function () {});
  }

  // Show the badge wherever the page has a placeholder for it (the welcome page).
  var slot = document.getElementById("visit-badge");
  if (slot) {
    var img = document.createElement("img");
    img.src = COUNTER_URL + "/badge.svg";
    img.alt = "Number of visits to this book";
    img.height = 20;
    slot.appendChild(img);
  }
})();
</script>
