project:
  type: book
  output-dir: _book
  post-render: tools/add-alt-text.R

book:
  title: "R for Audit Analytics"
  author: "Anil Goyal"
  date: today
  site-url: https://anilyayavar.github.io/new-book/
  repo-url: https://github.com/anilyayavar/new-book
  repo-actions: [edit, issue]
  cover-image: images/cover.jpg
  cover-image-alt: "Cover of R for Audit Analytics"
  subtitle: "Data analytics for auditors, with R and the tidyverse"
  description: "A practical guide to data analytics for auditors, using R and the tidyverse: reading and cleaning audit data, forensic tests, sampling, statistics, machine learning, text, network and geospatial analytics, and reproducible reports, with Indian audit examples throughout."
  license: "CC BY-NC"
  chapters:
    - index.qmd
    - index-preface.qmd
    - index-about-author.qmd
    - 00-Zero.qmd
    - part: p01-basics.qmd
      chapters:
        - 02-basics.qmd
        - 03-Subsets.qmd
        - 04-functions.qmd
        - 04-functions-existing-and-useful-functions-in-base-r.qmd
        - 04-functions-pipes-in-r.qmd
        - 05-1conditionals.qmd
        - 06-1-functionalprog.qmd
    - part: p02-data.qmd
      chapters:
        - 06-2-workflow.qmd
        - 07-1-reading.qmd
        - 07-1-reading-data-cleaning-in-r.qmd
        - 07-1b-pdf-excel.qmd
        - 07-2-merge.qmd
        - 10-1-dplyr.qmd
        - 10-2-joins.qmd
        - 11-tidyr.qmd
        - 12-8Lubridate.qmd
        - 12-8b-duckdb.qmd
    - part: p03-explore.qmd
      chapters:
        - 08-plot.qmd
        - 09-1ggplot2.qmd
        - 14-3Factors.qmd
        - 12-1Desc.qmd
        - 12-2stats.qmd
        - 12-3Samp.qmd
        - 12-3b-tests.qmd
    - part: p04-strings.qmd
      chapters:
        - 14-1Stringr.qmd
        - 14-2Regex.qmd
        - 14-2Regex-regex-in-human-readble-format-using-rebu.qmd
        - 15-stringdist.qmd
    - part: p05-forensic.qmd
      chapters:
        - 17a-validation.qmd
        - 17-Anamolous.qmd
        - 19-nigrini-tests.qmd
        - 20-duplicates.qmd
        - 20b-record-linkage.qmd
        - 21-gaps.qmd
        - 21b-process-mining.qmd
    - part: p06-patterns.qmd
      chapters:
        - 12-4Reg.qmd
        - 12-4b-logistic.qmd
        - 12-4c-trees.qmd
        - 12-4d-forest.qmd
        - 12-5PCA.qmd
        - 12-6KMeans.qmd
        - 12-7Apriori.qmd
        - 12-9ts.qmd
        - 18-anomaly.qmd
        - 26-DEA.qmd
    - part: p07-text.qmd
      chapters:
        - 14-4text.qmd
        - 14-4text-sentiment-analysis.qmd
        - 14-4text-visualising-text-analytics-through-wordc.qmd
    - part: p08-network.qmd
      chapters:
        - 13-Network.qmd
        - 13-Network-applying-network-analysis-in-audit-fraud.qmd
    - part: p09-geo.qmd
      chapters:
        - 16-Rgeo.qmd
        - 16-Rgeo-geo-coding-in-r.qmd
        - 16-Rgeo-reverse-geo-coding.qmd
    - part: p10-reporting.qmd
      chapters:
        - 27-reports.qmd
    - references.qmd
  appendices:
    - 98-datasets.qmd
    - 99-packages.qmd
    - 97-colors.qmd

bibliography: [book.bib, packages.bib]
nocite: |
  @*
csl: chicago-fullnote-bibliography.csl

execute:
  freeze: auto

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: style.css
    include-after-body: counter.html
    code-link: true
    toc-depth: 3
    fig-align: center

editor: source
