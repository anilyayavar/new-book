project:
  type: book
  output-dir: docs
  post-render:
    - tools/add-alt-text.R
    - tools/old-redirects.R

book:
  title: "R for Audit Analytics"
  author: "Anil Goyal"
  date: "2023-01-19"
  site-url: https://anilyayavar.github.io/new-book/
  repo-url: https://github.com/anilyayavar/new-book
  repo-branch: master
  repo-actions: [edit, issue]
  cover-image: images/cover.jpg
  cover-image-alt: "Cover of R for Audit Analytics"
  subtitle: "Data analytics for auditors, with R and the tidyverse"
  description: "A practical guide to data analytics for auditors, using R and the tidyverse: reading and cleaning audit data, forensic tests, sampling, statistics, machine learning, text, network and geospatial analytics, and reproducible reports, with Indian audit examples throughout."
  license: "CC BY-NC"
  page-footer:
    center: "Built with [R](https://www.r-project.org) and [Quarto](https://quarto.org)"
  chapters:
    - index.qmd
    - index-preface.qmd
    - index-about-author.qmd
    - how-to-use.qmd
    - 00-Zero.qmd
    - part: part1-foundations.qmd
      chapters:
        - 02-basics.qmd
        - 03-Subsets.qmd
        - 04-functions.qmd
        - 04-functions-existing-and-useful-functions-in-base-r.qmd
        - 04-functions-pipes-in-r.qmd
        - 05-1conditionals.qmd
        - 06-1-functionalprog.qmd
    - part: part2-data-ready.qmd
      chapters:
        - 06-2-workflow.qmd
        - 06-3-privacy.qmd
        - 07-1-reading.qmd
        - 07-1-reading-data-cleaning-in-r.qmd
        - 07-1b-pdf-excel.qmd
        - 07-1c-web.qmd
        - 07-2-merge.qmd
        - 10-1-dplyr.qmd
        - 10-2-joins.qmd
        - 11-tidyr.qmd
        - 12-8Lubridate.qmd
        - 12-8b-duckdb.qmd
    - part: part3-text-fields.qmd
      chapters:
        - 14-1Stringr.qmd
        - 14-2Regex.qmd
        - 14-2Regex-regex-in-human-readble-format-using-rebu.qmd
    - part: part4-explore-sample.qmd
      chapters:
        - 08-plot.qmd
        - 09-1ggplot2.qmd
        - 09-2ggplot2-polish.qmd
        - 14-3Factors.qmd
        - 12-1Desc.qmd
        - 12-2stats.qmd
        - 12-3Samp.qmd
        - 12-3b-tests.qmd
    - part: part5-forensic.qmd
      chapters:
        - 17a-validation.qmd
        - 17-Anamolous.qmd
        - 19-nigrini-tests.qmd
        - 20-duplicates.qmd
        - 15-stringdist.qmd
        - 20b-record-linkage.qmd
        - 21-gaps.qmd
        - 21b-process-mining.qmd
    - part: part6-risk-scoring.qmd
      chapters:
        - 12-4Reg.qmd
        - 12-4Reg-multiple.qmd
        - 12-4b-logistic.qmd
        - 12-4c-trees.qmd
        - 12-4d-forest.qmd
        - 26-DEA.qmd
        - 26b-impact.qmd
    - part: part7-hidden-patterns.qmd
      chapters:
        - 12-5PCA.qmd
        - 12-6KMeans.qmd
        - 12-7Apriori.qmd
        - 12-9ts.qmd
        - 18-anomaly.qmd
    - part: part8-beyond-tables.qmd
      chapters:
        - 14-4text.qmd
        - 14-4text-sentiment-analysis.qmd
        - 14-4text-visualising-text-analytics-through-wordc.qmd
        - 13-Network.qmd
        - 13-Network-applying-network-analysis-in-audit-fraud.qmd
        - 16-Rgeo.qmd
        - 16-Rgeo-geo-coding-in-r.qmd
        - 16-Rgeo-reverse-geo-coding.qmd
    - part: part9-applying.qmd
      chapters:
        - 22-journal-entries.qmd
        - 22b-reconciliation.qmd
        - 21c-tender-flags.qmd
        - 21c-bid-rigging.qmd
        - 21d-bid-shapes.qmd
        - 22c-payables.qmd
        - 22d-payroll.qmd
        - 22e-revenue.qmd
        - 23-health-scheme.qmd
    - part: part10-reporting.qmd
      chapters:
        - 27-reports.qmd
    - references.qmd
  appendices:
    - audit-questions.qmd
    - 98-datasets.qmd
    - 99-packages.qmd

bibliography: [book.bib, packages.bib]
nocite: |
  @*
csl: chicago-fullnote-bibliography.csl

execute:
  freeze: auto

date-modified: today

language:
  title-block-published: "First published"
  title-block-modified: "Last updated"

format:
  html:
    date-format: "D MMMM YYYY"
    theme:
      light: cosmo
      dark: darkly
    css: style.css
    code-link: true
    toc-depth: 3
    fig-align: center

editor: source
